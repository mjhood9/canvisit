name: canvisit
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.4.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.6.12
  google_fonts: ^6.1.0
  email_validator: ^2.1.17
  google_sign_in: ^6.1.2
  flutter_map: 8.2.2
  latlong2: ^0.9.0
  geolocator: ^14.0.2
  flutter_map_animations: ^0.9.0
  flutter_map_location_marker: ^10.1.0
  http: ^1.2.0
  google_generative_ai: ^0.4.7
  flutter_markdown: ^0.6.10
  url_launcher: ^6.3.2
  flutter_dotenv: ^6.0.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1
  image_picker: ^1.0.4
  video_player: ^2.8.1
  chewie: ^1.7.1
  firebase_messaging: ^15.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.3.2

  flutter_lints: ^5.0.0
flutter_icons:
  android: true
  ios: true
  remove_alpha_ios: true
flutter_native_splash:
  color: "#7A0C0F" # Your brand color
  image: assets/images/can_logo_splash.png # Path to your logo

  ios: true
  web: false
flutter:


  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/cities/
    - assets/images/casablanca/
    - assets/images/rabat/
    - assets/images/tangier/
    - assets/images/fes/
    - assets/images/marrakech/
    - assets/images/agadir/
